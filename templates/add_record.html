<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add {{ record_type }}</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Arial", sans-serif;
        margin: 0;
        padding: 0;
        background: linear-gradient(120deg, #28a745, #155724);
        color: #fff;
        text-align: center;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      h1 {
        font-size: 2.5em;
        margin-bottom: 20px;
        color: #fff;
      }

      form {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 10px;
        max-width: 600px;
        width: 100%;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }

      form label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
        color: #155724;
        text-align: left;
      }

      form input,
      form select,
      form button {
        width: calc(100% - 20px);
        padding: 10px;
        margin-top: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        display: block;
        font-size: 1em;
        margin-left: 10px;
      }

      form button {
        background: #28a745;
        color: #fff;
        border: none;
        cursor: pointer;
        font-size: 1.2em;
        font-weight: bold;
        transition: background 0.3s ease;
        margin-top: 20px;
        padding: 12px 20px;
      }

      form button:hover {
        background: #218838;
      }

      .back-link {
        margin-top: 20px;
        text-decoration: none;
        color: #fff;
        font-size: 1.1em;
        font-weight: bold;
        transition: color 0.3s ease;
      }

      .back-link:hover {
        color: #cce5ff;
      }
    </style>
  </head>
  <body>
    <h1>Add {{ record_type }}</h1>
    <form method="post">
      {% if record_type == "Vehicle" %}
      <label for="make">Make:</label>
      <input
        type="text"
        name="make"
        id="make"
        placeholder="e.g., Toyota"
        required
      />
      <label for="model">Model:</label>
      <input
        type="text"
        name="model"
        id="model"
        placeholder="e.g., Corolla"
        required
      />
      <label for="year">Year:</label>
      <input
        type="number"
        name="year"
        id="year"
        placeholder="e.g., 2020"
        required
      />
      <label for="vin">VIN:</label>
      <input
        type="text"
        name="vin"
        id="vin"
        placeholder="Vehicle Identification Number"
        required
      />
      {% elif record_type == "Part" %}
      <label for="part_name">Part Name:</label>
      <input
        type="text"
        name="part_name"
        id="part_name"
        placeholder="e.g., Brake Pads"
        required
      />
      <label for="quantity">Quantity:</label>
      <input
        type="number"
        name="quantity"
        id="quantity"
        placeholder="e.g., 4"
        required
      />
      <label for="vehicle_id">Associated Vehicle:</label>
      <select name="vehicle_id" id="vehicle_id">
        <option value="">None</option>
        {% for vehicle in vehicles %}
        <option value="{{ vehicle['VehicleID'] }}">
          {{ vehicle['Make'] }} {{ vehicle['Model'] }} ({{ vehicle['Year'] }})
        </option>
        {% endfor %}
      </select>
      {% elif record_type == "Maintenance" %}
      <label for="vehicle_id">Vehicle:</label>
      <select name="vehicle_id" id="vehicle_id" required>
        {% for vehicle in vehicles %}
        <option value="{{ vehicle['VehicleID'] }}">
          {{ vehicle['Make'] }} {{ vehicle['Model'] }} ({{ vehicle['Year'] }})
        </option>
        {% endfor %}
      </select>
      <label for="date_of_service">Date of Service:</label>
      <input type="date" name="date_of_service" id="date_of_service" required />
      <label for="type_of_service">Type of Service:</label>
      <input
        type="text"
        name="type_of_service"
        id="type_of_service"
        placeholder="e.g., Oil Change"
        required
      />
      <label for="mileage">Mileage:</label>
      <input
        type="number"
        name="mileage"
        id="mileage"
        placeholder="e.g., 50000"
        required
      />
      <label for="next_service_date">Next Service Date:</label>
      <input type="date" name="next_service_date" id="next_service_date" />
      <label for="next_service_mileage">Next Service Mileage:</label>
      <input
        type="number"
        name="next_service_mileage"
        id="next_service_mileage"
        placeholder="e.g., 60000"
      />
      {% endif %}
      <button type="submit">Add {{ record_type }}</button>
    </form>
    <a href="/add_menu" class="back-link">Back to Add Menu</a>
  </body>
</html>
